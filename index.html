<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#04060c">
  <title>WC26 // PREDICTION ARENA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04060c;
      --panel: rgba(255, 255, 255, 0.035);
      --line: rgba(0, 229, 255, 0.16);
      --cyan: #00e5ff;
      --magenta: #ff2d78;
      --amber: #ffb300;
      --text: #d7e3ee;
      --text-dim: #6d7f91;
      --clip: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 229, 255, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(255, 45, 120, 0.06), transparent);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .box { max-width: 420px; width: 100%; text-align: center; }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .glow { color: var(--cyan); text-shadow: 0 0 18px rgba(0, 229, 255, 0.6); }
    .yr { color: var(--magenta); text-shadow: 0 0 18px rgba(255, 45, 120, 0.5); }
    .sub {
      color: var(--text-dim);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .ball { font-size: 3rem; margin: 10px 0 18px; }
    .msg { font-size: 1.25rem; font-weight: 600; line-height: 1.5; margin-bottom: 26px; }
    .msg em { color: var(--cyan); font-style: normal; }
    .podium {
      background: var(--panel);
      border: 1px solid var(--line);
      clip-path: var(--clip);
      padding: 18px 20px 20px;
      margin-bottom: 26px;
    }
    .podium h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      color: var(--amber);
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 6px 2px;
    }
    .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.07); }
    .row .pts { color: var(--text-dim); font-size: 0.95rem; font-weight: 600; }
    .row.gold .name { color: var(--amber); }
    .foot { color: var(--text-dim); font-size: 0.95rem; font-weight: 600; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div class="box">
    <h1><span class="glow">WC</span><span class="yr">26</span> // ARENA</h1>
    <div class="sub">Prediction Arena</div>
    <div class="ball">🏆</div>
    <p class="msg">A világbajnokság véget ért — köszi mindenkinek a játékot!<br>
      <em>Az aréna pihen, de még visszatér.</em></p>
    <div class="podium">
      <h2>Végeredmény — Top 3</h2>
      <div class="row gold"><span class="name">🥇 Márton Laci</span><span class="pts">306 pt</span></div>
      <div class="row"><span class="name">🥈 Kristóf</span><span class="pts">299 pt</span></div>
      <div class="row"><span class="name">🥉 Fuggő</span><span class="pts">276 pt</span></div>
    </div>
    <p class="foot">GG mindenkinek · 2026 ⚽</p>
  </div>
</body>
</html>
